<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Bembo&rsquo;s Zoo</title>
     
    <style type="text/css">
        /* create variables for each color used in the design */
        :root {
            --background-color: #ffedd4;
            --teal: #009966;
            --orange: #f54a00;
            --black: #111111;
        }
        * {
            font-family: "Cardo", Georgia, serif;
            font-weight: normal;
            font-size: 1vw; 
        }
        body {
            background-color: var(--background-color);
        }
        
        /* Base styles for dynamically created elements */
        h1.animal-name { 
            position: absolute;
            margin: 0;
            padding: 0;
        }
        h2.animal-letter {
            position: absolute;
            margin: 0;
            padding: 0;
        }
        .animal-container {
            position: absolute;
        }
        .animal-container > * {
            position: absolute;
        }
        .partial-background {
            position: absolute;
        }
    </style>
</head>
<body>

<!-- Link to separate JavaScript files -->
<script src="letters.js"></script>
<script src="renderLetter.js"></script>

</body>
</html>
