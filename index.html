<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <title>Bembo&rsquo;s Zoo</title>
     
    <style type="text/css">
        * {
            font-family: "Cardo", Georgia, serif;
            font-weight: normal;
            font-size: 1vw; 
        }
        body {
            background-color: #ffedd4;
        }
        h1.animal-name { 
            position: absolute;
            left: 12rem;
            top: 3rem;
            color: #009966;
            font-size: 5rem; /* Relative to baseline font size */
            margin: 0;
            padding: 0;
        }
        .black-background {
            position: absolute;
            top: 0;
            right: 0;
            width: 23.85rem;
            height: 100%;
            background-color: black;
            z-index: -1; /* Ensure it is behind other content */
        }
        h2.animal-letter {
            position: absolute;
            right: 1rem;
            top: -15rem;
            color: #f54a00;
            font-size: 60rem; /* Relative to baseline font size */
            margin: 0;
            padding: 0;
        }
        .animal-container, .animal-container > * {
            position: absolute;
        }
        .a {
            left: 30rem;
            top: 6rem;
            font-size: 22rem;
            color: #f54a00;
        }
    </style>
</head>
<body>

<h1 class="animal-name">Antelope</h1>
<div class="black-background"></div>
<h2 class="animal-letter">A</h2>
<div class="animal-container">
     <div class="a">a</div>
</div>

</body>
</html>
