<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>Bembo&rsquo;s Zoo</title>
     
    <style type="text/css">
        /* create variables for each color used in the design */
        :root {
            --background-color: #ffedd4;
            --teal: #009966;
            --orange: #f54a00;
            --black: #111111;
        }
        * {
            font-family: "Cardo", Georgia, serif;
            font-weight: normal;
            font-size: 1vw; 
        }
        body {
            background-color: var(--background-color);
        }
        h1.animal-name { 
            position: absolute;
            left: 12rem;
            top: 3rem;
            color: var(--teal);
            font-size: 5rem; 
            margin: 0;
            padding: 0;
        }
        .black-background {
            position: absolute;
            top: 0;
            right: 0;
            width: 23.85rem;
            height: 100%;
            background-color: var(--black);
            z-index: -1; 
        }
        h2.animal-letter {
            position: absolute;
            right: 1rem;
            top: -15rem;
            color: var(--orange);
            font-size: 60rem; 
            margin: 0;
            padding: 0;
        }
        .animal-container {
            --scale: 1;
            left: 0rem;
            top: 0rem;
         }
        .animal-container, .animal-container > * {
            position: absolute;
        }
        .a {
            left: calc(29.5rem * var(--scale));
            top: calc(4.5rem * var(--scale));
            font-size: calc(24rem * var(--scale));
            color: var(--orange);
        }
        .o {
            left: calc(24rem * var(--scale));
            top: calc(8rem * var(--scale));
            font-size: calc(24rem * var(--scale));
            color: var(--black);
        }
    </style>
</head>
<body>
<h1 class="animal-name">Antelope</h1>
<div class="black-background"></div>
<h2 class="animal-letter">A</h2>
<div class="animal-container">
     <div class="a">a</div>
     <div class="o">O</div>
</div>
</body>
</html>
